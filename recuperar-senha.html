<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha — KS Stock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="auth-brand-logo">KS</div>
          <span class="auth-brand-name">KS Stock</span>
        </div>
        <h1 class="auth-title" id="recovery-title">Recuperação de Senha</h1>
        <p class="auth-subtitle" id="recovery-subtitle">Informe seu e-mail cadastrado para receber as instruções.</p>
      </div>

      <form id="form-reset">
        <div class="form-group">
          <label class="form-label" for="reset-email">E-mail Cadastrado</label>
          <input type="email" id="reset-email" class="form-control" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <button type="submit" id="btn-submit-reset" class="btn btn-primary btn-block" style="padding:.75rem;margin-top:1rem;">Enviar Link de Recuperação</button>
      </form>

      <form id="form-new-password" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="new-password">Nova senha</label>
          <input type="password" id="new-password" class="form-control" minlength="6" required autocomplete="new-password">
        </div>
        <div class="form-group" style="margin-top:1rem;">
          <label class="form-label" for="confirm-password">Confirmar nova senha</label>
          <input type="password" id="confirm-password" class="form-control" minlength="6" required autocomplete="new-password">
        </div>
        <button type="submit" id="btn-update-password" class="btn btn-primary btn-block" style="padding:.75rem;margin-top:1rem;">Salvar nova senha</button>
      </form>

      <div class="auth-footer-links">Lembrou da senha? <a href="login.html">Voltar para o login</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const client = getSupabase();
      const requestForm = document.getElementById('form-reset');
      const recoveryForm = document.getElementById('form-new-password');

      const showRecovery = () => {
        requestForm.style.display = 'none';
        recoveryForm.style.display = 'block';
        document.getElementById('recovery-title').textContent = 'Criar nova senha';
        document.getElementById('recovery-subtitle').textContent = 'Digite sua nova senha para acessar o KS Stock.';
      };

      if (client) {
        const { data } = await client.auth.getSession();
        if (/type=recovery/i.test(location.hash) || /type=recovery/i.test(location.search) || data?.session) {
          showRecovery();
        }

        client.auth.onAuthStateChange((event) => {
          if (event === 'PASSWORD_RECOVERY') showRecovery();
        });
      }

      requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit-reset');
        btn.disabled = true;
        btn.textContent = 'Enviando...';
        await Auth.resetPassword(document.getElementById('reset-email').value.trim());
        btn.disabled = false;
        btn.textContent = 'Enviar Link de Recuperação';
      });

      recoveryForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('new-password').value;
        const confirmation = document.getElementById('confirm-password').value;
        const btn = document.getElementById('btn-update-password');

        if (password.length < 6) {
          UI.showToast('warning','Senha inválida','A senha deve ter pelo menos 6 caracteres.');
          return;
        }
        if (password !== confirmation) {
          UI.showToast('warning','Senhas diferentes','As duas senhas precisam ser iguais.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Salvando...';
        const result = await Auth.updatePassword(password);
        if (result?.success) {
          UI.showToast('success','Senha alterada','Sua senha foi atualizada.');
          setTimeout(() => location.replace('login.html'), 900);
        } else {
          btn.disabled = false;
          btn.textContent = 'Salvar nova senha';
        }
      });
    });
  </script>
</body>
</html>
