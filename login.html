<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — KS Stock</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><rect width='24' height='24' rx='6' fill='%234f46e5'/><text x='50%25' y='68%25' font-size='14' font-weight='bold' text-anchor='middle' fill='white'>KS</text></svg>">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="auth-brand-logo">KS</div>
          <span class="auth-brand-name">KS Stock</span>
        </div>
        <h1 class="auth-title">Acessar sua conta</h1>
        <p class="auth-subtitle">Controle seu estoque. Simplifique seu negócio.</p>
      </div>

      <!-- Banner caso Supabase não esteja configurado ainda -->
      <div id="config-alert-banner" class="config-banner" style="display: none;">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="flex-shrink:0; margin-top:1px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <div>
          <strong>Configuração Necessária:</strong> Insira a URL e a Anon Key do seu projeto Supabase no arquivo <code>js/config.js</code> para conectar o banco de dados.
        </div>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-email">E-mail</label>
          <input type="email" id="login-email" class="form-control" placeholder="seu@email.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password">Senha</label>
            <a href="recuperar-senha.html" style="font-size: 0.78rem; color: var(--color-primary); font-weight: 500;">Esqueceu a senha?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="Sua senha secreta" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block" style="padding: 0.75rem; margin-top: 1rem;">
          Entrar no Sistema
        </button>
      </form>

      <div class="auth-footer-links">
        Não possui uma conta? <a href="cadastro.html">Cadastrar sua empresa</a>
      </div>
    </div>
  </div>

  <!-- CDN Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.redirectIfAuthenticated();

      const form = document.getElementById('form-login');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-submit-login');

        btn.disabled = true;
        btn.textContent = 'Acessando...';

        await Auth.signIn(email, pass);

        btn.disabled = false;
        btn.textContent = 'Entrar no Sistema';
      });
    });
  </script>
</body>
</html>
