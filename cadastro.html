<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre sua Empresa — KS Stock</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><rect width='24' height='24' rx='6' fill='%234f46e5'/><text x='50%25' y='68%25' font-size='14' font-weight='bold' text-anchor='middle' fill='white'>KS</text></svg>">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box" style="max-width: 480px;">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="auth-brand-logo">KS</div>
          <span class="auth-brand-name">KS Stock</span>
        </div>
        <h1 class="auth-title">Crie sua conta grátis</h1>
        <p class="auth-subtitle">Comece a controlar o estoque do seu negócio hoje mesmo.</p>
      </div>

      <!-- Banner caso Supabase não esteja configurado ainda -->
      <div id="config-alert-banner" class="config-banner" style="display: none;">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="flex-shrink:0; margin-top:1px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <div>
          <strong>Configuração Necessária:</strong> Insira a URL e a Anon Key do seu projeto Supabase no arquivo <code>js/config.js</code> para conectar o banco de dados.
        </div>
      </div>

      <form id="form-signup">
        <div class="form-group">
          <label class="form-label" for="signup-name">Seu Nome Completo <span class="req">*</span></label>
          <input type="text" id="signup-name" class="form-control" placeholder="Ex: Kaue Santos" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-company">Nome da sua Empresa <span class="req">*</span></label>
          <input type="text" id="signup-company" class="form-control" placeholder="Ex: Boutique Elegance, Padaria Central..." required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">E-mail Profissional <span class="req">*</span></label>
          <input type="email" id="signup-email" class="form-control" placeholder="seu@empresa.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Senha de Acesso <span class="req">*</span></label>
          <input type="password" id="signup-password" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" id="btn-submit-signup" class="btn btn-primary btn-block" style="padding: 0.75rem; margin-top: 1rem;">
          Criar Minha Empresa no KS Stock
        </button>
      </form>

      <div class="auth-footer-links">
        Já tem uma conta cadastrada? <a href="login.html">Fazer login</a>
      </div>
    </div>
  </div>

  <!-- CDN Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.redirectIfAuthenticated();

      const form = document.getElementById('form-signup');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signup-name').value;
        const company = document.getElementById('signup-company').value;
        const email = document.getElementById('signup-email').value;
        const pass = document.getElementById('signup-password').value;
        const btn = document.getElementById('btn-submit-signup');

        btn.disabled = true;
        btn.textContent = 'Configurando sua empresa...';

        await Auth.signUp(name, company, email, pass);

        btn.disabled = false;
        btn.textContent = 'Criar Minha Empresa no KS Stock';
      });
    });
  </script>
</body>
</html>
