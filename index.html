<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KS Stock — Controle de Estoque SaaS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><rect width='24' height='24' rx='6' fill='%234f46e5'/><text x='50%25' y='68%25' font-size='14' font-weight='bold' text-anchor='middle' fill='white'>KS</text></svg>">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #0f172a; color: white;">
  <div style="text-align: center; max-width: 400px; padding: 2rem;">
    <div style="width: 56px; height: 56px; background: #4f46e5; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);">
      KS
    </div>
    <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">KS Stock</h2>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem;">Controle seu estoque. Simplifique seu negócio.</p>
    <div style="display: inline-block; width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Supabase JS Client v2 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!CONFIG.isSupabaseConfigured()) {
        window.location.href = 'login.html';
        return;
      }
      const client = getSupabase();
      if (client) {
        const { data: { session } } = await client.auth.getSession();
        if (session) {
          window.location.href = 'dashboard.html';
          return;
        }
      }
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
